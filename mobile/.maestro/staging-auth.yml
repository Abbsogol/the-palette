# Run only on a configured staging build with a synthetic, onboarded account.
# Supply TEST_EMAIL and TEST_PASSWORD from the staging test secret store.
appId: app.laque.mobile.development
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Profile, tab,.*"
- tapOn: Sign in
- tapOn:
    text: Email
    index: 1
- inputText: ${TEST_EMAIL}
- pressKey: Enter
- tapOn:
    text: Password
    index: 1
- inputText: ${TEST_PASSWORD}
- pressKey: Enter
- tapOn:
    text: Sign in
    index: 1
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible: Saved designs
    timeout: 20000
- stopApp
- launchApp
- tapOn: "Profile, tab,.*"
- assertVisible: Saved designs
