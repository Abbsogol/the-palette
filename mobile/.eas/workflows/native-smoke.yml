name: Native build and configuration smoke
jobs:
  android:
    type: build
    params:
      platform: android
      profile: e2e-smoke
  ios:
    type: build
    params:
      platform: ios
      profile: e2e-smoke
  android_smoke:
    needs: [android]
    type: maestro
    params:
      build_id: ${{ needs.android.outputs.build_id }}
      flow_path: ['.maestro/unconfigured.yml']
  ios_smoke:
    needs: [ios]
    type: maestro
    params:
      build_id: ${{ needs.ios.outputs.build_id }}
      flow_path: ['.maestro/unconfigured.yml']
